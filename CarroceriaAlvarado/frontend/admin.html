<!DOCTYPE html>
<html lang="es">
<head>
    <title>Gestión de Usuarios - Carrocería Alvarado</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="vendor/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="fonts/font-awesome-4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" type="text/css" href="css/util.css">
    <link rel="stylesheet" type="text/css" href="css/main.css">
    <style>
        /* Puedes añadir estilos específicos para esta página aquí o en un nuevo CSS */
        .table-actions {
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <div class="limiter">
        <div class="container-login100" style="/* Considera un fondo diferente o ninguno si es un panel interno */">
            <div class="wrap-login100 p-l-55 p-r-55 p-t-65 p-b-54"> <span class="login100-form-title p-b-49">
                    Gestión de Usuarios
                </span>

                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Username</th>
                                <th>Email</th>
                                <th>Rol</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="userTableBody">
                            </tbody>
                    </table>
                </div>

                <div class="text-center p-t-50">
                    <a href="index.html" class="txt1">
                        Cerrar Sesión
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="vendor/jquery/jquery-3.2.1.min.js"></script>
    <script src="js/main.js"></script> 
    <script>
        $(document).ready(function() {
            const token = localStorage.getItem('token');
            const userRol = localStorage.getItem('userRol');

            if (!token) {
                // Si no hay token, redirigir a login
                window.location.href = 'index.html';
                return; // Detener ejecución adicional
            }

            // Aquí podrías añadir una verificación del token con el backend si es necesario,
            // pero para una protección básica del lado del cliente, el rol es suficiente por ahora.
            // El backend SIEMPRE debe validar el token para las acciones de API.

            if (userRol !== 'Administrador') {
                // Si el rol no es Administrador, redirigir (puede ser a users.html o index.html)
                alert('Acceso denegado. No tienes permisos de administrador.');
                window.location.href = 'users.html'; // O index.html si prefieres
                return; // Detener ejecución adicional
            }

            // Si es admin, continuar cargando el contenido de la página de admin
            console.log("Acceso de administrador concedido a admin.html.");
            // Aquí llamarías a funciones para cargar datos de admin, ej: loadUsers();

            // Ejemplo: Añadir botón de logout si no lo tienes en el HTML directamente
            // Podrías tener un div <div id="userInfo"></div> y un <button id="logoutButtonAdmin">Cerrar Sesión</button>
            $('#logoutButtonAdmin').on('click', function() { // Asegúrate que este botón exista en admin.html
                localStorage.removeItem('token');
                localStorage.removeItem('userRol');
                window.location.href = 'index.html';
            });
        });

        // function loadUsers() { ... Lógica para cargar usuarios ... }
    </script>
</body>
</html>
