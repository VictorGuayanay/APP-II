<!DOCTYPE html>
<html lang="es">
<head>
    <title>Restablecer Contraseña - Carrocería Alvarado</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--===============================================================================================-->	
    <link rel="icon" type="image/png" href="images/icons/favicon.ico"/>
    <!--===============================================================================================-->
    <link rel="stylesheet" type="text/css" href="vendor/bootstrap/css/bootstrap.min.css">
    <!--===============================================================================================-->
    <link rel="stylesheet" type="text/css" href="fonts/font-awesome-4.7.0/css/font-awesome.min.css">
    <!--===============================================================================================-->
    <link rel="stylesheet" type="text/css" href="fonts/iconic/css/material-design-iconic-font.min.css">
    <!--===============================================================================================-->
    <link rel="stylesheet" type="text/css" href="vendor/animate/animate.css">
    <!--===============================================================================================-->	
    <link rel="stylesheet" type="text/css" href="vendor/css-hamburgers/hamburgers.min.css">
    <!--===============================================================================================-->
    <link rel="stylesheet" type="text/css" href="vendor/animsition/css/animsition.min.css">
    <!--===============================================================================================-->
    <link rel="stylesheet" type="text/css" href="vendor/select2/select2.min.css">
    <!--===============================================================================================-->	
    <link rel="stylesheet" type="text/css" href="vendor/daterangepicker/daterangepicker.css">
    <!--===============================================================================================-->
    <link rel="stylesheet" type="text/css" href="css/util.css">
    <link rel="stylesheet" type="text/css" href="css/main.css">
    <link rel="stylesheet" type="text/css" href="css/modern-design.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Shared auth screen styles are now in modern-design.css */
    </style>
</head>
<body>
    <div class="limiter">
        <div class="auth-container">
            <div class="auth-wrap animate__animated animate__fadeIn">
                <form class="login100-form validate-form" id="resetPassForm">
                    <div class="auth-logo">
                        <i class="zmdi zmdi-key"></i>
                    </div>

                    <h2 class="auth-title p-b-40">
                        RECUPERAR ACCESO
                    </h2>

                    <div class="wrap-input100 validate-input m-b-30" data-validate="Ingrese un correo válido">
                        <input class="input100" type="email" id="email" name="email" placeholder="Correo Electrónico">
                        <span class="focus-input100" data-placeholder="&#xf15a;"></span>
                    </div>

                    <div class="container-login100-form-btn">
                        <button class="auth-btn" type="submit">
                            ENVIAR INSTRUCCIONES
                        </button>
                    </div>

                    <div id="message" class="message"></div>

                    <div class="text-center p-t-30">
                        <a href="index.html" class="txt2">
                            Volver a Iniciar Sesión
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div id="dropDownSelect1"></div>
    
    <!--===============================================================================================-->
    <script src="vendor/jquery/jquery-3.2.1.min.js"></script>
    <!--===============================================================================================-->
    <script src="vendor/animsition/js/animsition.min.js"></script>
    <!--===============================================================================================-->
    <script src="vendor/bootstrap/js/popper.js"></script>
    <script src="vendor/bootstrap/js/bootstrap.min.js"></script>
    <!--===============================================================================================-->
    <script src="vendor/select2/select2.min.js"></script>
    <!--===============================================================================================-->
    <script src="vendor/daterangepicker/moment.min.js"></script>
    <script src="vendor/daterangepicker/daterangepicker.js"></script>
    <!--===============================================================================================-->
    <script src="vendor/countdowntime/countdowntime.js"></script>
    <!--===============================================================================================-->
    <script src="js/config.js"></script>
    <script src="js/main.js"></script>
    <!--===============================================================================================-->
    <script>
        $(document).ready(function() {
            $('#resetPassForm').on('submit', function(event) {
                event.preventDefault(); 
                const messageDiv = $('#message');
                messageDiv.text('Instrucciones enviadas a su correo electrónico').css('color', 'orange');
                setTimeout(function() {
                    window.location.href = 'index.html';
                }, 3000);
            });
        });
    </script>
</body>
</html>
