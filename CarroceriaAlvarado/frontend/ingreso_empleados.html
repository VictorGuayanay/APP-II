<!DOCTYPE html>
<html lang="es">
<head>
    <title>Ingresar Empleado - Carrocería Alvarado</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="vendor/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="fonts/font-awesome-4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" type="text/css" href="css/main.css">
</head>
<body>

<div class="admin-wrapper">
    <!-- Sidebar -->
    <nav id="sidebar">
        <div class="sidebar-header">
            <h3>Carrocería Alvarado</h3>
        </div>
        <ul class="list-unstyled components">
            <p class="ms-3">Administración</p>
            <!-- Aquí puedes replicar la estructura de tu sidebar -->
            <li><a href="admin.html"><i class="fa fa-users"></i> Gestión de Usuarios</a></li>
            <li><a href="ver_inventario.html"><i class="fa fa-archive"></i> Inventario</a></li>
            <li><a href="orden_trabajo.html"><i class="fa fa-briefcase"></i> Órdenes de Trabajo</a></li>
            <li><a href="ingresar_cliente.html"><i class="fa fa-user-plus"></i> Ingresar Cliente</a></li>
            <li class="active"><a href="ingresar_empleado.html"><i class="fa fa-address-card"></i> Ingresar Empleado</a></li>
        </ul>
    </nav>

    <!-- Page Content -->
    <div id="content">
        <nav class="navbar navbar-expand-lg navbar-light top-navbar">
            <div class="container-fluid">
                <button type="button" id="sidebarCollapse" class="btn btn-info" style="background-color: #0073aa; border-color: #0073aa;">
                    <i class="fa fa-align-left"></i>
                    <span>Menú</span>
                </button>
                <div class="user-info">
                    <span>Hola, <strong id="currentUserName">Admin</strong>!</span>
                    <a href="#" id="logoutButton" class="ms-3">Cerrar Sesión</a>
                </div>
            </div>
        </nav>

        <div class="content-area container-fluid pt-4">
            <h2 class="card-header-title">Registrar Nuevo Empleado</h2>
            <div class="card">
                <div class="card-body">
                    <form id="formIngresarEmpleado">
                        <div class="mb-3">
                            <label for="empleadoNombre" class="form-label">Nombre Completo <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="empleadoNombre" required>
                        </div>
                        <div class="mb-3">
                            <label for="empleadoCedula" class="form-label">Cédula <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="empleadoCedula" maxlength="10" pattern="[0-9]{1,10}" title="Solo números, máximo 10 dígitos" required>
                        </div>
                         <div class="mb-3">
                            <label for="empleadoRol" class="form-label">Rol / Cargo <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="empleadoRol" placeholder="Ej: Mecánico, Pintor, Asistente" required>
                        </div>
                        <div class="mb-3">
                            <label for="empleadoTelefono" class="form-label">Teléfono <span class="text-danger">*</span></label>
                            <input type="tel" class="form-control" id="empleadoTelefono" maxlength="10" pattern="[0-9]{1,10}" title="Solo números, máximo 10 dígitos" required>
                        </div>
                        <div class="mb-3">
                            <label for="empleadoFechaContratacion" class="form-label">Fecha de Contratación <span class="text-danger">*</span></label>
                            <input type="date" class="form-control" id="empleadoFechaContratacion" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Registrar Empleado</button>
                        <div id="mensajeEmpleado" class="mt-3"></div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="vendor/jquery/jquery-3.2.1.min.js"></script>
<script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script>
$(document).ready(function () {
    // Lógica estándar
    $('#sidebarCollapse').on('click', function () { $('#sidebar').toggleClass('active'); });
    const token = localStorage.getItem('token');
    if (!token) { window.location.href = 'index.html'; return; }
    const loggedInUsername = localStorage.getItem('loggedInUsername');
    if(loggedInUsername) { $('#currentUserName').text(loggedInUsername); }
    $('#logoutButton').on('click', function(e) { e.preventDefault(); localStorage.clear(); window.location.href = 'index.html'; });

    // Lógica para registrar empleado
    $('#formIngresarEmpleado').on('submit', function(event) {
        event.preventDefault();
        const mensajeDiv = $('#mensajeEmpleado');
        mensajeDiv.text('Procesando...').removeClass('alert-success alert-danger').addClass('alert alert-info');

        const empleadoData = {
            nombre: $('#empleadoNombre').val().trim(),
            cedula: $('#empleadoCedula').val().trim(),
            rol: $('#empleadoRol').val().trim(),
            telefono: $('#empleadoTelefono').val().trim(),
            fecha_contratacion: $('#empleadoFechaContratacion').val()
        };

        if (!empleadoData.nombre || !empleadoData.cedula || !empleadoData.rol || !empleadoData.telefono || !empleadoData.fecha_contratacion) {
            mensajeDiv.text('Todos los campos son obligatorios.').removeClass('alert-info').addClass('alert alert-danger');
            return;
        }

        $.ajax({
            url: 'http://127.0.0.1:5000/empleados',
            method: 'POST',
            headers: {
                'Authorization': 'Bearer ' + token,
                'Content-Type': 'application/json'
            },
            data: JSON.stringify(empleadoData),
            success: function(response) {
                mensajeDiv.text(response.message || 'Empleado registrado con éxito.').removeClass('alert-info').addClass('alert alert-success');
                $('#formIngresarEmpleado')[0].reset();
            },
            error: function(xhr) {
                mensajeDiv.text(xhr.responseJSON?.error || 'Error al registrar el empleado.').removeClass('alert-info').addClass('alert alert-danger');
            }
        });
    });
});
</script>

</body>
</html>
