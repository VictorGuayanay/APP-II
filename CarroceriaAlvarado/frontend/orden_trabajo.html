<!DOCTYPE html>
<html lang="es">
<head>
    <title>Crear Orden de Trabajo - Carrocería Alvarado</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" type="text/css" href="vendor/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="fonts/font-awesome-4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" type="text/css" href="css/main.css">
</head>
<body>

<div class="admin-wrapper">
    <nav id="sidebar">
        <div class="sidebar-header">
            <h3>Carrocería Alvarado</h3>
        </div>
        <ul class="list-unstyled components">
            <p class="ms-3">Administración</p>
            <li><a href="vision_general.html"><i class="fa fa-tachometer"></i> Visión General</a></li>
            <li><a href="admin.html"><i class="fa fa-users"></i> Gestión de Usuarios</a></li>
            <li><a href="ver_inventario.html"><i class="fa fa-archive"></i> Inventario</a></li>
            <li class="active"><a href="orden_trabajo.html"><i class="fa fa-briefcase"></i> Órdenes de Trabajo</a></li>
            <li><a href="ingresar_cliente.html"><i class="fa fa-user-plus"></i> Ingresar Cliente</a></li>
            <li><a href="ingresar_empleado.html"><i class="fa fa-address-card"></i> Ingresar Empleado</a></li>
        </ul>
    </nav>

    <div id="content">
        <nav class="navbar navbar-expand-lg navbar-light top-navbar">
            <div class="container-fluid">
                <button type="button" id="sidebarCollapse" class="btn btn-info">
                    <i class="fa fa-align-left"></i> <span>Menú</span>
                </button>
                <div class="user-info">
                    <span>Hola, <strong id="currentUserName">Usuario</strong>!</span>
                    <a href="#" id="logoutButton" class="ms-3">Cerrar Sesión</a>
                </div>
            </div>
        </nav>

        <div class="content-area container-fluid pt-4">
            <h2 class="card-header-title">Crear Nueva Orden de Trabajo</h2>
            
            <div class="card">
                <div class="card-header">
                    Detalles de la Orden
                </div>
                <div class="card-body">
                    <form id="formCrearOrden">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="selectCliente" class="form-label">Cliente <span class="text-danger">*</span></label>
                                <select class="form-select" id="selectCliente" required>
                                    <option value="">Cargando clientes...</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="selectTipoTrabajo" class="form-label">Tipo de Trabajo <span class="text-danger">*</span></label>
                                <select class="form-select" id="selectTipoTrabajo" required>
                                    <option value="">Seleccione un tipo de trabajo...</option>
                                    <option value="Pintura">Pintura</option>
                                    <option value="Electrico">Eléctrico</option>
                                    <option value="Enderezada">Enderezada</option>
                                    <option value="Tapiceria">Tapicería</option>
                                    <option value="Mecanica">Mecánica General</option>
                                </select>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="fechaInicio" class="form-label">Fecha de Inicio <span class="text-danger">*</span></label>
                                <input type="date" class="form-control" id="fechaInicio" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="fechaFin" class="form-label">Fecha de Finalización (Opcional)</label>
                                <input type="date" class="form-control" id="fechaFin">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="descripcionOrden" class="form-label">Descripción del Trabajo <span class="text-danger">*</span></label>
                            <textarea class="form-control" id="descripcionOrden" rows="4" placeholder="Ej: Pintura de puerta del conductor y revisión de sistema eléctrico." required></textarea>
                        </div>
                        
                        <button type="submit" class="btn btn-primary">Crear Orden y Asignar Empleado(s)</button>
                        <div id="mensajeCrearOrden" class="mt-3"></div>
                    </form>
                </div>
            </div>
        </div> 
    </div> 
</div> 

<script src="vendor/jquery/jquery-3.2.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

<script>
// Función para poblar el selector de clientes
function cargarSelectCliente() {
    console.log("Cargando datos para selector de Clientes...");
    const token = localStorage.getItem('token');
    const $selectCliente = $('#selectCliente');

    if (!token) { return; }

    // Cargar Clientes
    $.ajax({
        url: 'http://127.0.0.1:5000/clientes',
        method: 'GET',
        headers: { 'Authorization': 'Bearer ' + token },
        success: function(clientes) {
            $selectCliente.empty().append('<option value="">Seleccione un cliente...</option>');
            if (clientes && clientes.length > 0) {
                clientes.forEach(function(cliente) {
                    $selectCliente.append(`<option value="${cliente.id_cliente}">${cliente.nombre}</option>`);
                });
            } else {
                $selectCliente.append('<option value="">No hay clientes disponibles</option>');
            }
        },
        error: function(xhr) {
            console.error("Error al cargar clientes:", xhr.responseText);
            $selectCliente.empty().append('<option value="">Error al cargar clientes</option>');
        }
    });
}

$(document).ready(function() {
    // Lógica estándar
    $('#sidebarCollapse').on('click', function() { $('#sidebar').toggleClass('active'); });
    const token = localStorage.getItem('token');
    if (!token) { window.location.href = 'index.html'; return; }
    const loggedInUsername = localStorage.getItem('loggedInUsername');
    if (loggedInUsername) { $('#currentUserName').text(loggedInUsername); }
    $('#logoutButton').on('click', function(e) { e.preventDefault(); localStorage.clear(); window.location.href = 'index.html'; });

    // Llamar a la función para cargar el selector de clientes
    cargarSelectCliente();

    // Lógica para el Formulario de Crear Orden (MODIFICADA)
    $('#formCrearOrden').on('submit', function(event) {
        event.preventDefault();
        const mensajeDiv = $('#mensajeCrearOrden');
        mensajeDiv.text('Procesando...').removeClass('alert-success alert-danger').addClass('alert alert-info show');

        const ordenData = {
            id_cliente: $('#selectCliente').val(),
            tipo_trabajo: $('#selectTipoTrabajo').val(), // CAMBIO: Enviar tipo_trabajo
            fecha_inicio: $('#fechaInicio').val(),
            fecha_fin: $('#fechaFin').val() || null, 
            descripcion: $('#descripcionOrden').val().trim()
        };

        // Validación de datos
        if (!ordenData.id_cliente || !ordenData.tipo_trabajo || !ordenData.fecha_inicio || !ordenData.descripcion) {
            mensajeDiv.text('Todos los campos marcados con * son obligatorios.').removeClass('alert-info').addClass('alert alert-danger');
            return;
        }

        console.log("Enviando datos de nueva orden de trabajo (con tipo de trabajo):", ordenData);

        $.ajax({
            url: 'http://127.0.0.1:5000/ordenes-trabajo',
            method: 'POST',
            headers: {
                'Authorization': 'Bearer ' + token,
                'Content-Type': 'application/json'
            },
            data: JSON.stringify(ordenData),
            success: function(response) {
                console.log("Respuesta de crear orden:", response);
                const msg = response.message || `Orden creada con éxito (ID: ${response.id_orden_creada}).`;
                mensajeDiv.text(msg).removeClass('alert-info alert-danger').addClass('alert alert-success');
                $('#formCrearOrden')[0].reset(); 
            },
            error: function(xhr) {
                console.error("Error al crear orden de trabajo:", xhr.responseText);
                mensajeDiv.text(xhr.responseJSON?.error || "Error al crear la orden de trabajo.").removeClass('alert-info alert-success').addClass('alert alert-danger');
            }
        });
    });
});
</script>

</body>
</html>
