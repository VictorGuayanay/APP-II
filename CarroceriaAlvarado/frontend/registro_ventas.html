<!DOCTYPE html>
<html lang="es">
<head>
    <title>Registro de Ventas - Carrocerías Alvarado</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Registro de Ventas Directas - Carrocerías Alvarado. Venta directa de materiales a clientes.">
    <link rel="stylesheet" type="text/css" href="vendor/bootstrap/css/bootstrap5.min.css">
    <link rel="stylesheet" type="text/css" href="fonts/font-awesome-4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" type="text/css" href="css/main.css">
    <link rel="stylesheet" type="text/css" href="css/modern-design.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/fixed-layout.css">
    <!-- jsPDF para generar PDFs -->
    <script src="js/config.js"></script>
    <script src="js/dashboard-core.js"></script>
    <script src="vendor/jquery/jquery-3.2.1.min.js"></script>
<script src="vendor/bootstrap/js/bootstrap5.bundle.min.js"></script>

<script>
let todasLasVentas = [];
let ventaActual = null;

// Función para cerrar modal
function cerrarModalDetalle() {
    document.getElementById('modalDetalleVenta').style.display = 'none';
}

// Función para generar PDF del comprobante (Actualizada con Logo y Datos de Empresa)
function generarComprobantePDF(datosVenta, isReprint = false) {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    
    // Cargar Logo
    const img = new Image();
    img.src = 'images/logo.jpg';
    
    img.onload = function() {
        const margen = 20;
        let y = 15;
        
        // --- ENCABEZADO ---
        // Logo en la parte superior izquierda
        doc.addImage(this, 'JPG', margen, y, 35, 35);
        
        // Leyenda - SIN VALOR TRIBUTARIO (Centrada arriba)
        doc.setFontSize(8);
        doc.setTextColor(200, 0, 0);
        doc.setFont(undefined, 'bold');
        doc.text('DOCUMENTO CONTROL INTERNO - SIN VALOR TRIBUTARIO', 115, y + 5, { align: 'center' });
        
        // RE-IMPRESIÓN (Si aplica, debajo de la leyenda)
        if (isReprint) {
            doc.setFontSize(10);
            doc.text('*** RE-IMPRESIÓN ***', 115, y + 12, { align: 'center' });
        }
        
        // Datos de la Empresa (Alineados a la derecha del logo)
        doc.setTextColor(0, 0, 0);
        doc.setFontSize(16);
        doc.text('CARROCERÍAS ALVARADO', 190, y + 15, { align: 'right' });
        
        doc.setFontSize(9);
        doc.setFont(undefined, 'normal');
        doc.text('Telf: +593 99 991 1866', 190, y + 22, { align: 'right' });
        doc.text('Correo: carroceriasalvarado@hotmail.com', 190, y + 27, { align: 'right' });
        doc.text('Dirección: Avda. Monseñor Leonidas Proaño', 190, y + 32, { align: 'right' });
        doc.text('(a pocos metros de la línea férrea), Riobamba, Ecuador', 190, y + 37, { align: 'right' });
        
        y += 45;
        doc.line(margen, y, 190, y);
        y += 10;
        
        // Información del comprobante
        doc.setFontSize(14);
        doc.setFont(undefined, 'bold');
        doc.text(`COMPROBANTE DE VENTA #${datosVenta.id_venta}`, margen, y);
        y += 10;
        
        // Manejar fecha
        const fechaStr = typeof datosVenta.fecha_venta === 'string' 
            ? new Date(datosVenta.fecha_venta).toLocaleString('es-EC') 
            : new Date(datosVenta.fecha_venta).toLocaleString('es-EC');

        doc.setFontSize(10);
        doc.setFont(undefined, 'normal');
        doc.text(`Fecha de Emisión: ${fechaStr}`, margen, y);
        doc.text(`Emitido por: ${datosVenta.nombre_usuario || datosVenta.usuario || 'N/A'}`, 190, y, { align: 'right' });
        y += 10;
        
        // Bloque Cliente
        doc.setFillColor(245, 245, 245);
        doc.rect(margen, y, 170, 25, 'F');
        y += 7;
        doc.setFont(undefined, 'bold');
        doc.text('INFORMACIÓN DEL CLIENTE:', margen + 5, y);
        y += 6;
        doc.setFont(undefined, 'normal');
        doc.text(`Nombre: ${datosVenta.cliente_nombre}`, margen + 5, y);
        doc.text(`RUC/CI: ${datosVenta.cliente_ruc_ci || 'N/A'}`, 120, y);
        y += 6;
        doc.text(`Teléfono: ${datosVenta.cliente_telefono || 'N/A'}`, margen + 5, y);
        doc.text(`Email: ${datosVenta.cliente_email || 'N/A'}`, 120, y);
        y += 15;
        
        // Tabla Detalle
        doc.setFont(undefined, 'bold');
        doc.text('DESCRIPCIÓN', margen, y);
        doc.text('CANT.', 100, y);
        doc.text('P.UNIT', 130, y);
        doc.text('TOTAL', 170, y);
        y += 4;
        doc.line(margen, y, 190, y);
        y += 7;
        
        doc.setFont(undefined, 'normal');
        if (datosVenta.productos && Array.isArray(datosVenta.productos)) {
            datosVenta.productos.forEach(p => {
                doc.text(p.nombre_material.substring(0, 45), margen, y);
                doc.text(p.cantidad.toString(), 105, y, { align: 'center' });
                doc.text(`$${Number(p.precio_unitario || 0).toFixed(2)}`, 140, y, { align: 'right' });
                doc.text(`$${Number(p.total || 0).toFixed(2)}`, 185, y, { align: 'right' });
                y += 6;
                if (y > 270) { doc.addPage(); y = 20; }
            });
        }
        
        y += 5;
        doc.line(120, y, 190, y);
        y += 7;
        
        // Totales
        doc.text('SUBTOTAL:', 130, y);
        doc.text(`$${Number(datosVenta.subtotal_general || 0).toFixed(2)}`, 185, y, { align: 'right' });
        y += 6;
        doc.text('IVA:', 130, y);
        doc.text(`$${Number(datosVenta.iva_general || 0).toFixed(2)}`, 185, y, { align: 'right' });
        y += 8;
        doc.setFontSize(12);
        doc.setFont(undefined, 'bold');
        doc.text('TOTAL A PAGAR:', 130, y);
        doc.text(`$${Number(datosVenta.total_general || 0).toFixed(2)}`, 185, y, { align: 'right' });
        
        y += 20;
        doc.setFontSize(9);
        doc.setFont(undefined, 'normal');
        doc.text(`Forma de Pago: ${datosVenta.forma_pago}`, margen, y);
        
        y = 285;
        doc.setFontSize(8);
        doc.setTextColor(150);
        doc.text('Carrocerías Alvarado - Sistema de Gestión de Inventario', 105, y, { align: 'center' });
        
        const filename = isReprint ? `Recibo_CA_${datosVenta.id_venta}_REIMPRESION.pdf` : `Recibo_CA_${datosVenta.id_venta}.pdf`;
        doc.save(filename);
    };

    img.onerror = function() {
        console.error("No se pudo cargar el logo para el PDF. Generando sin logo.");
        alert("Error al cargar el logo. El PDF se generará sin imagen.");
    };
}

// Función para reimprimir comprobante
function reimprimirComprobante() {
    if (ventaActual) {
        generarComprobantePDF(ventaActual, true); // true = es reimpresión
    }
}

// Cargar ventas
function cargarVentas() {
    const token = localStorage.getItem('token');
    
    $.ajax({
        url: `${API_BASE_URL}/ventas-directas`,
        method: 'GET',
        headers: {
            'Authorization': 'Bearer ' + token
        },
        success: function(ventas) {
            todasLasVentas = ventas;
            mostrarVentas(ventas);
            actualizarEstadisticas(ventas);
            poblarFiltroClientes(ventas);
        },
        error: function(xhr) {
            console.error("Error al cargar ventas:", xhr.responseText);
            $('#tablaVentas').html('<tr><td colspan="7" class="text-center text-danger">Error al cargar ventas</td></tr>');
        }
    });
}

// Poblar dropdown de clientes
function poblarFiltroClientes(ventas) {
    const clientesUnicos = new Set();
    ventas.forEach(venta => {
        if (venta.cliente_nombre) {
            clientesUnicos.add(venta.cliente_nombre);
        }
    });
    
    const select = $('#filtroCliente');
    select.html('<option value="">Todos los clientes</option>');
    
    Array.from(clientesUnicos).sort().forEach(cliente => {
        select.append(`<option value="${cliente}">${cliente}</option>`);
    });
}

// Mostrar ventas en tabla
function mostrarVentas(ventas) {
    const tbody = $('#tablaVentas');
    
    if (ventas.length === 0) {
        tbody.html('<tr><td colspan="7" class="text-center">No hay ventas registradas</td></tr>');
        return;
    }
    
    let html = '';
    ventas.forEach(venta => {
        html += `<tr>
            <td>${venta.id_venta}</td>
            <td>${new Date(venta.fecha_venta).toLocaleString('es-EC')}</td>
            <td>${venta.cliente_nombre}</td>
            <td>$${venta.total_general.toFixed(2)}</td>
            <td>${venta.forma_pago}</td>
            <td>${venta.nombre_usuario}</td>
            <td>
                <button class="btn btn-sm btn-info" onclick="verDetalle(${venta.id_venta})">
                    <i class="fa fa-eye"></i> Ver
                </button>
            </td>
        </tr>`;
    });
    
    tbody.html(html);
}

// Ver detalle de venta
function verDetalle(idVenta) {
    const token = localStorage.getItem('token');
    
    $.ajax({
        url: `${API_BASE_URL}/ventas-directas/${idVenta}`,
        method: 'GET',
        headers: {
            'Authorization': 'Bearer ' + token
        },
        success: function(venta) {
            ventaActual = venta;
            
            $('#detalleVentaId').text(venta.id_venta);
            $('#detalleFecha').text(new Date(venta.fecha_venta).toLocaleString('es-EC'));
            $('#detalleUsuario').text(venta.nombre_usuario);
            $('#detalleCliente').text(`${venta.cliente_nombre} (${venta.tipo_cliente})`);
            $('#detalleFormaPago').text(venta.forma_pago);
            
            // Validar y mostrar totales
            const subtotal = venta.subtotal_general || 0;
            const iva = venta.iva_general || 0;
            const total = venta.total_general || 0;
            
            $('#detalleSubtotal').text(`$${Number(subtotal).toFixed(2)}`);
            $('#detalleIVA').text(`$${Number(iva).toFixed(2)}`);
            $('#detalleTotal').text(`$${Number(total).toFixed(2)}`);
            
            let productosHtml = '';
            venta.productos.forEach(p => {
                productosHtml += `<tr>
                    <td>${p.nombre_material}</td>
                    <td>${p.cantidad}</td>
                    <td>$${Number(p.precio_unitario || 0).toFixed(2)}</td>
                    <td>$${Number(p.subtotal || 0).toFixed(2)}</td>
                    <td>$${Number(p.valor_iva || 0).toFixed(2)}</td>
                    <td>$${Number(p.total || 0).toFixed(2)}</td>
                </tr>`;
            });
            $('#detalleProductos').html(productosHtml);
            
            document.getElementById('modalDetalleVenta').style.display = 'block';
        },
        error: function(xhr) {
            alert('Error al cargar detalle de venta');
        }
    });
}

// Aplicar filtros
function aplicarFiltros() {
    const fechaDesde = $('#filtroFechaDesde').val();
    const fechaHasta = $('#filtroFechaHasta').val();
    const cliente = $('#filtroCliente').val();
    
    let ventasFiltradas = todasLasVentas;
    
    if (fechaDesde) {
        ventasFiltradas = ventasFiltradas.filter(v => new Date(v.fecha_venta) >= new Date(fechaDesde));
    }
    
    if (fechaHasta) {
        const hasta = new Date(fechaHasta);
        hasta.setHours(23, 59, 59);
        ventasFiltradas = ventasFiltradas.filter(v => new Date(v.fecha_venta) <= hasta);
    }
    
    if (cliente) {
        ventasFiltradas = ventasFiltradas.filter(v => v.cliente_nombre === cliente);
    }
    
    mostrarVentas(ventasFiltradas);
    actualizarEstadisticas(ventasFiltradas);
}

// Actualizar estadísticas
function actualizarEstadisticas(ventas) {
    $('#totalVentas').text(ventas.length);
    
    const total = ventas.reduce((sum, v) => sum + v.total_general, 0);
    $('#totalRecaudado').text(`$${total.toFixed(2)}`);
}

// Document ready
$(document).ready(function() {
    // Verificar autenticación
    const token = localStorage.getItem('token');
    if (!token) {
        window.location.href = 'index.html';
        return;
    }
    
    // Mostrar nombre de usuario
    const username = localStorage.getItem('username');
    if (username) {
        $('#currentUserName').text(username);
    }
    
    // Cargar ventas
    cargarVentas();
    
    // Sidebar toggle
    $('#sidebarCollapse').on('click', function() {
        $('#sidebar').toggleClass('active');
    });
    
    // Logout
    
});
</script>

</body>
</html>
