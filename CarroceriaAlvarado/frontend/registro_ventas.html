<!DOCTYPE html>
<html lang="es">
<head>
    <title>Registro de Ventas - Carrocerías Alvarado</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="vendor/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="fonts/font-awesome-4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" type="text/css" href="css/main.css">
    <link rel="stylesheet" type="text/css" href="css/modern-design.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/fixed-layout.css">
    <!-- jsPDF para generar PDFs -->
    <script src="js/config.js"></script>
    <script src="js/dashboard-core.js"></script>
    <script src="vendor/jquery/jquery-3.2.1.min.js"></script>
<script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>

<script>
let todasLasVentas = [];
let ventaActual = null;

// Función para cerrar modal
function cerrarModalDetalle() {
    document.getElementById('modalDetalleVenta').style.display = 'none';
}

// Función para generar PDF del comprobante (reutilizada)
function generarComprobantePDF(datosVenta, isReprint = false) {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    
    const margen = 20;
    let y = 20;
    
    // Encabezado
    doc.setFontSize(10);
    doc.setTextColor(255, 0, 0);
    doc.text('DOCUMENTO SIN VALOR TRIBUTARIO', 105, y, { align: 'center' });
    y += 10;
    
    // RE-IMPRESIÓN si es reimpresión
    if (isReprint) {
        doc.setFontSize(12);
        doc.setTextColor(255, 0, 0);
        doc.setFont(undefined, 'bold');
        doc.text('*** RE-IMPRESIÓN ***', 105, y, { align: 'center' });
        y += 8;
        doc.setFont(undefined, 'normal');
    }
    
    doc.setFontSize(16);
    doc.setTextColor(0, 0, 0);
    doc.text('COMPROBANTE DE VENTA', 105, y, { align: 'center' });
    y += 5;
    doc.setFontSize(14);
    doc.text('Carrocerías Alvarado', 105, y, { align: 'center' });
    y += 15;
    
    doc.setFontSize(10);
    doc.text(`Venta #${datosVenta.id_venta}`, margen, y);
    
    // Manejar fecha - puede venir como string o Date
    const fecha = typeof datosVenta.fecha_venta === 'string' 
        ? datosVenta.fecha_venta 
        : new Date(datosVenta.fecha_venta).toLocaleString('es-EC');
    doc.text(`Fecha: ${fecha}`, 150, y);
    y += 7;
    doc.text(`Usuario: ${datosVenta.nombre_usuario || datosVenta.usuario}`, margen, y);
    y += 10;
    
    // Cliente
    doc.setFontSize(11);
    doc.setFont(undefined, 'bold');
    doc.text('CLIENTE:', margen, y);
    doc.setFont(undefined, 'normal');
    y += 6;
    doc.setFontSize(10);
    doc.text(`Tipo: ${datosVenta.tipo_cliente}`, margen, y);
    y += 5;
    doc.text(`Nombre: ${datosVenta.cliente_nombre}`, margen, y);
    y += 5;
    doc.text(`RUC/CI: ${datosVenta.cliente_ruc_ci || 'N/A'}`, margen, y);
    y += 10;
    
    // Productos
    doc.setFont(undefined, 'bold');
    doc.text('DETALLE DE PRODUCTOS:', margen, y);
    y += 7;
    
    doc.setFontSize(9);
    doc.text('Material', margen, y);
    doc.text('Cant.', 90, y);
    doc.text('P.Unit', 115, y);
    doc.text('Subtotal', 145, y);
    doc.text('IVA', 170, y);
    doc.text('Total', 185, y);
    y += 5;
    
    doc.line(margen, y, 200, y);
    y += 5;
    
    doc.setFont(undefined, 'normal');
    datosVenta.productos.forEach(producto => {
        if (y > 270) {
            doc.addPage();
            y = 20;
        }
        
        doc.text(producto.nombre_material.substring(0, 30), margen, y);
        doc.text(producto.cantidad.toString(), 90, y);
        doc.text(`$${Number(producto.precio_unitario || 0).toFixed(2)}`, 115, y);
        doc.text(`$${Number(producto.subtotal || 0).toFixed(2)}`, 145, y);
        doc.text(`$${Number(producto.valor_iva || producto.iva || 0).toFixed(2)}`, 170, y);
        doc.text(`$${Number(producto.total || 0).toFixed(2)}`, 185, y);
        y += 5;
    });
    
    y += 5;
    doc.line(margen, y, 200, y);
    y += 7;
    
    // Totales
    doc.setFont(undefined, 'bold');
    doc.setFontSize(10);
    doc.text('SUBTOTAL:', 125, y);
    doc.text(`$${Number(datosVenta.subtotal_general || 0).toFixed(2)}`, 185, y, { align: 'right' });
    y += 6;
    doc.text('IVA:', 125, y);
    doc.text(`$${Number(datosVenta.iva_general || 0).toFixed(2)}`, 185, y, { align: 'right' });
    y += 6;
    doc.setFontSize(12);
    doc.text('TOTAL:', 125, y);
    doc.text(`$${Number(datosVenta.total_general || 0).toFixed(2)}`, 185, y, { align: 'right' });
    y += 10;
    
    doc.setFontSize(10);
    doc.setFont(undefined, 'normal');
    doc.text(`Forma de Pago: ${datosVenta.forma_pago}`, margen, y);
    
    y = 280;
    doc.setFontSize(8);
    doc.setTextColor(128, 128, 128);
    doc.text('Gracias por su compra', 105, y, { align: 'center' });
    
    const filename = isReprint ? `Comprobante_Venta_${datosVenta.id_venta}_REIMPRESION.pdf` : `Comprobante_Venta_${datosVenta.id_venta}.pdf`;
    doc.save(filename);
}

// Función para reimprimir comprobante
function reimprimirComprobante() {
    if (ventaActual) {
        generarComprobantePDF(ventaActual, true); // true = es reimpresión
    }
}

// Cargar ventas
function cargarVentas() {
    const token = localStorage.getItem('token');
    
    $.ajax({
        url: `${API_BASE_URL}/ventas-directas`,
        method: 'GET',
        headers: {
            'Authorization': 'Bearer ' + token
        },
        success: function(ventas) {
            todasLasVentas = ventas;
            mostrarVentas(ventas);
            actualizarEstadisticas(ventas);
            poblarFiltroClientes(ventas);
        },
        error: function(xhr) {
            console.error("Error al cargar ventas:", xhr.responseText);
            $('#tablaVentas').html('<tr><td colspan="7" class="text-center text-danger">Error al cargar ventas</td></tr>');
        }
    });
}

// Poblar dropdown de clientes
function poblarFiltroClientes(ventas) {
    const clientesUnicos = new Set();
    ventas.forEach(venta => {
        if (venta.cliente_nombre) {
            clientesUnicos.add(venta.cliente_nombre);
        }
    });
    
    const select = $('#filtroCliente');
    select.html('<option value="">Todos los clientes</option>');
    
    Array.from(clientesUnicos).sort().forEach(cliente => {
        select.append(`<option value="${cliente}">${cliente}</option>`);
    });
}

// Mostrar ventas en tabla
function mostrarVentas(ventas) {
    const tbody = $('#tablaVentas');
    
    if (ventas.length === 0) {
        tbody.html('<tr><td colspan="7" class="text-center">No hay ventas registradas</td></tr>');
        return;
    }
    
    let html = '';
    ventas.forEach(venta => {
        html += `<tr>
            <td>${venta.id_venta}</td>
            <td>${new Date(venta.fecha_venta).toLocaleString('es-EC')}</td>
            <td>${venta.cliente_nombre}</td>
            <td>$${venta.total_general.toFixed(2)}</td>
            <td>${venta.forma_pago}</td>
            <td>${venta.nombre_usuario}</td>
            <td>
                <button class="btn btn-sm btn-info" onclick="verDetalle(${venta.id_venta})">
                    <i class="fa fa-eye"></i> Ver
                </button>
            </td>
        </tr>`;
    });
    
    tbody.html(html);
}

// Ver detalle de venta
function verDetalle(idVenta) {
    const token = localStorage.getItem('token');
    
    $.ajax({
        url: `${API_BASE_URL}/ventas-directas/${idVenta}`,
        method: 'GET',
        headers: {
            'Authorization': 'Bearer ' + token
        },
        success: function(venta) {
            ventaActual = venta;
            
            $('#detalleVentaId').text(venta.id_venta);
            $('#detalleFecha').text(new Date(venta.fecha_venta).toLocaleString('es-EC'));
            $('#detalleUsuario').text(venta.nombre_usuario);
            $('#detalleCliente').text(`${venta.cliente_nombre} (${venta.tipo_cliente})`);
            $('#detalleFormaPago').text(venta.forma_pago);
            
            // Validar y mostrar totales
            const subtotal = venta.subtotal_general || 0;
            const iva = venta.iva_general || 0;
            const total = venta.total_general || 0;
            
            $('#detalleSubtotal').text(`$${Number(subtotal).toFixed(2)}`);
            $('#detalleIVA').text(`$${Number(iva).toFixed(2)}`);
            $('#detalleTotal').text(`$${Number(total).toFixed(2)}`);
            
            let productosHtml = '';
            venta.productos.forEach(p => {
                productosHtml += `<tr>
                    <td>${p.nombre_material}</td>
                    <td>${p.cantidad}</td>
                    <td>$${Number(p.precio_unitario || 0).toFixed(2)}</td>
                    <td>$${Number(p.subtotal || 0).toFixed(2)}</td>
                    <td>$${Number(p.valor_iva || 0).toFixed(2)}</td>
                    <td>$${Number(p.total || 0).toFixed(2)}</td>
                </tr>`;
            });
            $('#detalleProductos').html(productosHtml);
            
            document.getElementById('modalDetalleVenta').style.display = 'block';
        },
        error: function(xhr) {
            alert('Error al cargar detalle de venta');
        }
    });
}

// Aplicar filtros
function aplicarFiltros() {
    const fechaDesde = $('#filtroFechaDesde').val();
    const fechaHasta = $('#filtroFechaHasta').val();
    const cliente = $('#filtroCliente').val();
    
    let ventasFiltradas = todasLasVentas;
    
    if (fechaDesde) {
        ventasFiltradas = ventasFiltradas.filter(v => new Date(v.fecha_venta) >= new Date(fechaDesde));
    }
    
    if (fechaHasta) {
        const hasta = new Date(fechaHasta);
        hasta.setHours(23, 59, 59);
        ventasFiltradas = ventasFiltradas.filter(v => new Date(v.fecha_venta) <= hasta);
    }
    
    if (cliente) {
        ventasFiltradas = ventasFiltradas.filter(v => v.cliente_nombre === cliente);
    }
    
    mostrarVentas(ventasFiltradas);
    actualizarEstadisticas(ventasFiltradas);
}

// Actualizar estadísticas
function actualizarEstadisticas(ventas) {
    $('#totalVentas').text(ventas.length);
    
    const total = ventas.reduce((sum, v) => sum + v.total_general, 0);
    $('#totalRecaudado').text(`$${total.toFixed(2)}`);
}

// Document ready
$(document).ready(function() {
    // Verificar autenticación
    const token = localStorage.getItem('token');
    if (!token) {
        window.location.href = 'index.html';
        return;
    }
    
    // Mostrar nombre de usuario
    const username = localStorage.getItem('username');
    if (username) {
        $('#currentUserName').text(username);
    }
    
    // Cargar ventas
    cargarVentas();
    
    // Sidebar toggle
    $('#sidebarCollapse').on('click', function() {
        $('#sidebar').toggleClass('active');
    });
    
    // Logout
    
});
</script>

</body>
</html>
