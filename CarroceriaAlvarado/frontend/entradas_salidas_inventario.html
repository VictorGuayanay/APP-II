// Funci�n para generar PDF del comprobante
function generarComprobantePDF(datosVenta) {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    
    // Configuraci�n
    const margen = 20;
    let y = 20;
    
    // Encabezado - DOCUMENTO SIN VALOR TRIBUTARIO
    doc.setFontSize(10);
    doc.setTextColor(255, 0, 0);
    doc.text('DOCUMENTO SIN VALOR TRIBUTARIO', 105, y, { align: 'center' });
    y += 10;
    
    // T�tulo
    doc.setFontSize(16);
    doc.setTextColor(0, 0, 0);
    doc.text('COMPROBANTE DE VENTA', 105, y, { align: 'center' });
    y += 5;
    doc.setFontSize(14);
    doc.text('Carrocer�as Alvarado', 105, y, { align: 'center' });
    y += 15;
    
    // Informaci�n de la venta
    doc.setFontSize(10);
    doc.text(`Venta #${datosVenta.id_venta}`, margen, y);
    doc.text(`Fecha: ${new Date().toLocaleString('es-EC')}`, 150, y);
    y += 7;
    doc.text(`Usuario: ${datosVenta.usuario}`, margen, y);
    y += 10;
    
    // Informaci�n del cliente
    doc.setFontSize(11);
    doc.setFont(undefined, 'bold');
    doc.text('CLIENTE:', margen, y);
    doc.setFont(undefined, 'normal');
    y += 6;
    doc.setFontSize(10);
    doc.text(`Tipo: ${datosVenta.cliente.tipo}`, margen, y);
    y += 5;
    doc.text(`Nombre: ${datosVenta.cliente.nombre}`, margen, y);
    y += 5;
    doc.text(`RUC/CI: ${datosVenta.cliente.ruc_ci}`, margen, y);
    if (datosVenta.cliente.telefono) {
        y += 5;
        doc.text(`Tel�fono: ${datosVenta.cliente.telefono}`, margen, y);
    }
    y += 10;
    
    // Tabla de productos
    doc.setFont(undefined, 'bold');
    doc.text('DETALLE DE PRODUCTOS:', margen, y);
    y += 7;
    
    // Encabezados de tabla
    doc.setFontSize(9);
    doc.text('Material', margen, y);
    doc.text('Cant.', 90, y);
    doc.text('P.Unit', 115, y);
    doc.text('Subtotal', 145, y);
    doc.text('IVA', 170, y);
    doc.text('Total', 185, y);
    y += 5;
    
    // L�nea separadora
    doc.line(margen, y, 200, y);
    y += 5;
    
    // Productos
    doc.setFont(undefined, 'normal');
    datosVenta.productos.forEach(producto => {
        if (y > 270) { // Nueva p�gina si es necesario
            doc.addPage();
            y = 20;
        }
        
        doc.text(producto.nombre_material.substring(0, 30), margen, y);
        doc.text(producto.cantidad.toString(), 90, y);
        doc.text(`$${producto.precio_unitario.toFixed(2)}`, 115, y);
        doc.text(`$${producto.subtotal.toFixed(2)}`, 145, y);
        doc.text(`$${producto.iva.toFixed(2)}`, 170, y);
        doc.text(`$${producto.total.toFixed(2)}`, 185, y);
        y += 5;
    });
    
    y += 5;
    doc.line(margen, y, 200, y);
    y += 7;
    
    // Totales
    doc.setFont(undefined, 'bold');
    doc.setFontSize(10);
    doc.text('SUBTOTAL:', 125, y);
    doc.text(`$${datosVenta.totales.subtotal.toFixed(2)}`, 185, y, { align: 'right' });
    y += 6;
    doc.text('IVA:', 125, y);
    doc.text(`$${datosVenta.totales.iva.toFixed(2)}`, 185, y, { align: 'right' });
    y += 6;
    doc.setFontSize(12);
    doc.text('TOTAL:', 125, y);
    doc.text(`$${datosVenta.totales.total.toFixed(2)}`, 185, y, { align: 'right' });
    y += 10;
    
    // Forma de pago
    doc.setFontSize(10);
    doc.setFont(undefined, 'normal');
    doc.text(`Forma de Pago: ${datosVenta.forma_pago}`, margen, y);
    
    // Pie de p�gina
    y = 280;
    doc.setFontSize(8);
    doc.setTextColor(128, 128, 128);
    doc.text('Gracias por su compra', 105, y, { align: 'center' });
    
    // Descargar PDF
    doc.save(`Comprobante_Venta_${datosVenta.id_venta}.pdf`);
}

// Funci�n para cargar clientes
function cargarClientes() {
    console.log("cargarClientes() - Iniciando carga...");
    const token = localStorage.getItem('token');
    const $select = $('#ventaCliente');

    $select.html('<option value="">Cargando clientes...</option>').prop('disabled', true);

    if (!token) {
        console.error("cargarClientes() - No hay token.");
        $select.html('<option value="">Error de autenticaci�n</option>');
        return;
    }

    $.ajax({
        url: `${API_BASE_URL}/clientes`,
        method: 'GET',
        headers: {
            'Authorization': 'Bearer ' + token
        },
        success: function(clientes) {
            console.log("cargarClientes() - Clientes recibidos:", clientes);
            
            $select.empty().append('<option value="">Seleccione un cliente...</option>');

            if (clientes && Array.isArray(clientes) && clientes.length > 0) {
                clientes.forEach(function(cliente) {
                    if (cliente.id_cliente && cliente.nombre) {
                        const optionHtml = `<option value="${cliente.id_cliente}" 
                            data-tipo="Registrado"
                            data-ruc="${cliente.cedula || ''}"
                            data-nombre="${cliente.nombre}"
                            data-telefono="${cliente.telefono || ''}"
                            data-email="${cliente.email || ''}">
                            ${cliente.nombre} - ${cliente.cedula || 'S/N'}
                        </option>`;
                        $select.append(optionHtml);
                    }
                });
                $select.prop('disabled', false);
            } else {
                $select.append('<option value="">No hay clientes disponibles</option>');
            }
        },
        error: function(xhr) {
            console.error("cargarClientes() - Error:", xhr.status, xhr.responseText);
            $select.empty().append('<option value="">Error al cargar clientes</option>');
        }
    });
}

// Funci�n para mostrar informaci�n del cliente
function mostrarInfoCliente() {
    const $select = $('#ventaCliente');
    const $option = $select.find('option:selected');
    
    if ($option.val() && clienteSeleccionado) {
        let html = `
            <strong>Tipo:</strong> ${clienteSeleccionado.tipo}<br>
            <strong>RUC/CI:</strong> ${clienteSeleccionado.ruc_ci || 'N/A'}<br>
            <strong>Nombre:</strong> ${clienteSeleccionado.nombre}<br>
            <strong>Tel�fono:</strong> ${clienteSeleccionado.telefono || 'N/A'}<br>
            <strong>Email:</strong> ${clienteSeleccionado.email || 'N/A'}
        `;
        $('#datosCliente').html(html);
        $('#infoCliente').show();
    } else {
        $('#infoCliente').hide();
    }
}

// Funci�n para agregar producto al carrito
function agregarAlCarrito(producto) {
    carritoProductos.push(producto);
    actualizarTablaCarrito();
    habilitarBotonVenta();
}

// Funci�n para eliminar producto del carrito
function eliminarDelCarrito(index) {
    carritoProductos.splice(index, 1);
    actualizarTablaCarrito();
    habilitarBotonVenta();
}

// Funci�n para actualizar tabla del carrito
function actualizarTablaCarrito() {
    const $tbody = $('#carritoBody');
    const $totales = $('#carritoTotales');
    
    if (carritoProductos.length === 0) {
        $tbody.html(`
            <tr id="carritoVacio">
                <td colspan="10" class="text-center text-muted">
                    <i class="fa fa-shopping-cart"></i> El carrito est� vac�o
                </td>
            </tr>
        `);
        $totales.hide();
        return;
    }
    
    let html = '';
    let totalSubtotal = 0;
    let totalGanancia = 0;
    let totalIVA = 0;
    let totalGeneral = 0;
    
    carritoProductos.forEach((producto, index) => {
        totalSubtotal += producto.subtotal;
        totalGanancia += producto.ganancia;
        totalIVA += producto.iva;
        totalGeneral += producto.total;
        
        html += `
            <tr>
                <td>${producto.nombre_material}</td>
                <td>${producto.cantidad}</td>
                <td>$${producto.precio_unitario.toFixed(2)}</td>
                <td>$${producto.subtotal.toFixed(2)}</td>
                <td>${producto.porcentaje_ganancia}%</td>
                <td>$${producto.ganancia.toFixed(2)}</td>
                <td>${producto.porcentaje_iva}%</td>
                <td>$${producto.iva.toFixed(2)}</td>
                <td class="fw-bold">$${producto.total.toFixed(2)}</td>
                <td>
                    <button class="btn btn-sm btn-danger" onclick="eliminarDelCarrito(${index})">
                        <i class="fa fa-trash"></i>
                    </button>
                </td>
            </tr>
        `;
    });
    
    $tbody.html(html);
    
    // Actualizar totales
    $('#totalSubtotal').text('$' + totalSubtotal.toFixed(2));
    $('#totalGanancia').text('$' + totalGanancia.toFixed(2));
    $('#totalIVA').text('$' + totalIVA.toFixed(2));
    $('#totalGeneral').text('$' + totalGeneral.toFixed(2));
    $totales.show();
}

// Funci�n para habilitar/deshabilitar bot�n de venta
function habilitarBotonVenta() {
    const tieneProductos = carritoProductos.length > 0;
    const tieneCliente = clienteSeleccionado !== null;
    $('#btnRegistrarVenta').prop('disabled', !(tieneProductos && tieneCliente));
}

// Funci�n para cargar materiales filtrados por proveedor
function cargarMaterialesPorProveedor(idProveedor) {
    console.log("cargarMaterialesPorProveedor() - ID Proveedor:", idProveedor);
    const token = localStorage.getItem('token');
    const $select = $('#ventaNombreMaterial');

    if (!idProveedor) {
        $select.html('<option value="">Seleccione un proveedor primero...</option>').prop('disabled', true);
        limpiarCampos();
        return;
    }

    $select.html('<option value="">Cargando materiales...</option>').prop('disabled', true);

    $.ajax({
        url: `${API_BASE_URL}/materiales`,
        method: 'GET',
        headers: {
            'Authorization': 'Bearer ' + token
        },
        success: function(materiales) {
            console.log("cargarMaterialesPorProveedor() - Materiales recibidos:", materiales);
            
            // Filtrar materiales por proveedor y con stock
            const materialesFiltrados = materiales.filter(function(material) {
                return material.id_proveedor == idProveedor && material.cantidad > 0;
            });
            
            materialesDisponibles = materialesFiltrados;
            
            $select.empty().append('<option value="">Seleccione un material...</option>');

            if (materialesFiltrados.length > 0) {
                materialesFiltrados.forEach(function(material) {
                    const optionHtml = `<option value="${material.id_material}" 
                        data-nombre="${material.nombre}"
                        data-stock="${material.cantidad}"
                        data-precio="${material.precio_venta || 0}"
                        data-unidad="${material.abreviatura_unidad || material.nombre_unidad || 'N/A'}">
                        ${material.nombre} (Stock: ${material.cantidad} ${material.abreviatura_unidad || ''})
                    </option>`;
                    $select.append(optionHtml);
                });
                $select.prop('disabled', false);
            } else {
                $select.append('<option value="">No hay materiales disponibles de este proveedor</option>');
                $select.prop('disabled', true);
            }
        },
        error: function(xhr) {
            console.error("cargarMaterialesPorProveedor() - Error:", xhr.status, xhr.responseText);
            $select.empty().append('<option value="">Error al cargar materiales</option>');
        }
    });
}

// Funci�n para actualizar informaci�n del material seleccionado
function actualizarInfoMaterial() {
    const $select = $('#ventaNombreMaterial');
    const $option = $select.find('option:selected');
    
    if ($option.val()) {
        const stock = $option.data('stock') || 0;
        const precio = parseFloat($option.data('precio')) || 0;
        const unidad = $option.data('unidad') || 'N/A';
        
        $('#ventaStockDisponible').val(stock + ' ' + unidad);
        $('#ventaPrecioUnitario').val('$' + precio.toFixed(2));
        $('#ventaUnidad').val(unidad);
        
        calcularTotal();
    } else {
        limpiarCampos();
    }
}

// Funci�n para calcular el total de venta con ganancia e IVA
function calcularTotal() {
    const $select = $('#ventaNombreMaterial');
    const $option = $select.find('option:selected');
    const cantidad = parseInt($('#ventaCantidad').val()) || 0;
    const porcentajeGanancia = parseInt($('#ventaPorcentajeGanancia').val()) || 0;
    const porcentajeIVA = parseInt($('#ventaPorcentajeIVA').val()) || 0;
    
    if ($option.val() && cantidad > 0) {
        const precioUnitario = parseFloat($option.data('precio')) || 0;
        
        // Calcular subtotal (precio � cantidad)
        const subtotal = precioUnitario * cantidad;
        
        // Calcular ganancia
        const ganancia = subtotal * (porcentajeGanancia / 100);
        
        // Calcular IVA sobre el subtotal
        const iva = subtotal * (porcentajeIVA / 100);
        
        // Calcular total
        const total = subtotal + ganancia + iva;
        
        // Mostrar valores
        $('#ventaSubtotal').val('$' + subtotal.toFixed(2));
        $('#ventaGanancia').val('$' + ganancia.toFixed(2));
        $('#ventaIVA').val('$' + iva.toFixed(2));
        $('#ventaTotal').val('$' + total.toFixed(2));
    } else {
        $('#ventaSubtotal').val('');
        $('#ventaGanancia').val('');
        $('#ventaIVA').val('');
        $('#ventaTotal').val('');
    }
}

// Funci�n para limpiar campos
function limpiarCampos() {
    $('#ventaStockDisponible').val('');
    $('#ventaPrecioUnitario').val('');
    $('#ventaUnidad').val('');
    $('#ventaSubtotal').val('');
    $('#ventaGanancia').val('');
    $('#ventaIVA').val('');
    $('#ventaTotal').val('');
}

$(document).ready(function () {
    $('#sidebarCollapse').on('click', function () {
        $('#sidebar').toggleClass('active');
    });

    const token = localStorage.getItem('token');
    const userRol = localStorage.getItem('userRol'); 
    const loggedInUsername = localStorage.getItem('loggedInUsername');

    const rolesPermitidos = ['Administrador', 'Supervisor', 'Encargado de Inventario']; 

    if (!token || !userRol || !rolesPermitidos.includes(userRol)) {
        console.log("entradas_salidas_inventario.html - Acceso denegado.");
        window.location.href = 'index.html';
        return; 
    }

    if (loggedInUsername) {
        $('#currentUserName').text(loggedInUsername);
    }

    

    // Cargar datos iniciales
    cargarClientes();
    cargarProveedores();

    // Event listeners - Cliente
    $('#ventaCliente').on('change', function() {
        const $option = $(this).find('option:selected');
        if ($option.val()) {
            clienteSeleccionado = {
                tipo: $option.data('tipo'),
                id_cliente: $option.val(),
                ruc_ci: $option.data('ruc'),
                nombre: $option.data('nombre'),
                telefono: $option.data('telefono'),
                email: $option.data('email')
            };
            mostrarInfoCliente();
            habilitarBotonVenta();
        } else {
            clienteSeleccionado = null;
            $('#infoCliente').hide();
            habilitarBotonVenta();
        }
    });

    // Bot�n Consumidor Final
    $('#btnConsumidorFinal').on('click', function() {
        clienteSeleccionado = {
            tipo: 'Consumidor Final',
            id_cliente: null,
            ruc_ci: '9999999999999',
            nombre: 'CONSUMIDOR FINAL',
            telefono: '',
            email: ''
        };
        $('#ventaCliente').val('');
        mostrarInfoCliente();
        habilitarBotonVenta();
    });

    // Bot�n para abrir modal de nuevo cliente
    $('#btnAbrirModalCliente').on('click', function() {
        document.getElementById('modalClienteTemporal').style.display = 'block';
    });

    // Modal Cliente Temporal - Ahora guarda en BD
    $('#btnGuardarClienteTemporal').on('click', function() {
        const cedula = $('#tempRucCi').val().trim();
        const nombre = $('#tempNombre').val().trim();
        const telefono = $('#tempTelefono').val().trim();
        const email = $('#tempEmail').val().trim();

        if (!cedula || !nombre) {
            alert('C�dula/RUC y Nombre son requeridos');
            return;
        }

        // Guardar cliente en la base de datos
        const token = localStorage.getItem('token');
        const nuevoCliente = {
            cedula: cedula,
            nombre: nombre,
            telefono: telefono,
            email: email,
            estado: 1
        };

        $.ajax({
            url: `${API_BASE_URL}/clientes`,
            method: 'POST',
            headers: {
                'Authorization': 'Bearer ' + token,
                'Content-Type': 'application/json'
            },
            data: JSON.stringify(nuevoCliente),
            success: function(response) {
                console.log("Cliente creado:", response);
                
                // Cerrar modal
                document.getElementById('modalClienteTemporal').style.display = 'none';
                $('#formClienteTemporal')[0].reset();
                
                // Recargar lista de clientes
                cargarClientes();
                
                // Esperar un momento y seleccionar el nuevo cliente
                setTimeout(function() {
                    if (response.id_cliente) {
                        $('#ventaCliente').val(response.id_cliente).trigger('change');
                    }
                }, 500);
                
                alert('Cliente registrado exitosamente');
            },
            error: function(xhr) {
                console.error("Error al crear cliente:", xhr.responseText);
                let errorMsg = "Error al registrar el cliente.";
                if (xhr.responseJSON && xhr.responseJSON.error) {
                    errorMsg = xhr.responseJSON.error;
                }
                alert(errorMsg);
            }
        });
    });

    // Event listeners - Productos
    $('#ventaProveedor').on('change', function() {
        const idProveedor = $(this).val();
        cargarMaterialesPorProveedor(idProveedor);
    });
    
    $('#ventaNombreMaterial').on('change', actualizarInfoMaterial);
    $('#ventaCantidad').on('input', calcularTotal);
    $('#ventaPorcentajeGanancia').on('change', calcularTotal);
    $('#ventaPorcentajeIVA').on('change', calcularTotal);

    // Bot�n Limpiar Formulario
    $('#btnLimpiarFormulario').on('click', function() {
        $('#formAgregarProducto')[0].reset();
        $('#ventaNombreMaterial').prop('disabled', true).html('<option value="">Seleccione un proveedor primero...</option>');
        limpiarCampos();
    });

    // Formulario Agregar al Carrito
    $('#formAgregarProducto').on('submit', function(event) {
        event.preventDefault();
        const mensajeDiv = $('#mensajeProducto');
        
        if (!clienteSeleccionado) {
            mensajeDiv.html('<div class="alert alert-warning">Primero seleccione un cliente</div>');
            return;
        }

        const $select = $('#ventaNombreMaterial');
        const $option = $select.find('option:selected');
        const nombreMaterial = $option.data('nombre');
        const cantidadStr = $('#ventaCantidad').val();
        const stock = $option.data('stock') || 0;
        const porcentajeGanancia = parseInt($('#ventaPorcentajeGanancia').val());
        const porcentajeIVA = parseInt($('#ventaPorcentajeIVA').val());

        if (!$select.val() || !cantidadStr || !porcentajeGanancia || !porcentajeIVA) {
            mensajeDiv.html('<div class="alert alert-warning">Complete todos los campos requeridos</div>');
            return;
        }
        
        const cantidad = parseInt(cantidadStr);
        if (isNaN(cantidad) || cantidad <= 0) {
            mensajeDiv.html('<div class="alert alert-danger">La cantidad debe ser un n�mero positivo</div>');
            return;
        }

        if (cantidad > stock) {
            mensajeDiv.html(`<div class="alert alert-danger">Stock insuficiente. Disponible: ${stock}</div>`);
            return;
        }

        const precioUnitario = parseFloat($option.data('precio')) || 0;
        const subtotal = precioUnitario * cantidad;
        const ganancia = subtotal * (porcentajeGanancia / 100);
        const iva = subtotal * (porcentajeIVA / 100);
        const total = subtotal + ganancia + iva;

        const producto = {
            id_material: $select.val(),
            nombre_material: nombreMaterial,
            cantidad: cantidad,
            precio_unitario: precioUnitario,
            subtotal: subtotal,
            porcentaje_ganancia: porcentajeGanancia,
            ganancia: ganancia,
            porcentaje_iva: porcentajeIVA,
            iva: iva,
            total: total
        };

        agregarAlCarrito(producto);
        mensajeDiv.html('<div class="alert alert-success">? Producto agregado al carrito</div>');
        setTimeout(() => mensajeDiv.html(''), 3000);
        
        // Limpiar formulario pero mantener proveedor
        const proveedorActual = $('#ventaProveedor').val();
        $('#formAgregarProducto')[0].reset();
        $('#ventaProveedor').val(proveedorActual);
        cargarMaterialesPorProveedor(proveedorActual);
        limpiarCampos();
    });

    // Bot�n Registrar Venta Completa
    $('#btnRegistrarVenta').on('click', function() {
        const mensajeDiv = $('#mensajeVenta');
        const formaPago = $('#ventaFormaPagoFinal').val();

        if (!formaPago) {
            mensajeDiv.html('<div class="alert alert-warning">Seleccione una forma de pago</div>');
            return;
        }

        if (carritoProductos.length === 0) {
            mensajeDiv.html('<div class="alert alert-warning">El carrito est� vac�o</div>');
            return;
        }

        if (!clienteSeleccionado) {
            mensajeDiv.html('<div class="alert alert-warning">Seleccione un cliente</div>');
            return;
        }

        mensajeDiv.html('<div class="alert alert-info">Procesando venta...</div>');
        $('#btnRegistrarVenta').prop('disabled', true);

        // Calcular totales
        let subtotalGeneral = 0;
        let gananciaGeneral = 0;
        let ivaGeneral = 0;
        let totalGeneral = 0;

        carritoProductos.forEach(producto => {
            subtotalGeneral += producto.subtotal;
            gananciaGeneral += producto.ganancia;
            ivaGeneral += producto.iva;
            totalGeneral += producto.total;
        });

        const dataVenta = {
            cliente: clienteSeleccionado,
            productos: carritoProductos,
            totales: {
                subtotal: subtotalGeneral,
                ganancia: gananciaGeneral,
                iva: ivaGeneral,
                total: totalGeneral
            },
            forma_pago: formaPago
        };

        const token = localStorage.getItem('token');

        $.ajax({
            url: `${API_BASE_URL}/ventas-directas`,
            method: 'POST',
            headers: {
                'Authorization': 'Bearer ' + token,
                'Content-Type': 'application/json'
            },
            data: JSON.stringify(dataVenta),
            success: function(response) {
                console.log("Venta registrada:", response);
                
                // Guardar datos de la venta para el PDF
                ultimaVentaRegistrada = {
                    id_venta: response.id_venta,
                    cliente: clienteSeleccionado,
                    productos: [...carritoProductos],
                    totales: {
                        subtotal: subtotalGeneral,
                        ganancia: gananciaGeneral,
                        iva: ivaGeneral,
                        total: totalGeneral
                    },
                    forma_pago: formaPago,
                    usuario: localStorage.getItem('username') || 'Usuario'
                };
                
                mensajeDiv.html(`<div class="alert alert-success">
                    ? <strong>Venta registrada exitosamente</strong><br>
                    <strong>ID Venta:</strong> ${response.id_venta}<br>
                    <strong>Total:</strong> $${totalGeneral.toFixed(2)}<br><br>
                    <button class="btn btn-primary" onclick="generarComprobantePDF(ultimaVentaRegistrada)">
                        <i class="fa fa-print"></i> Imprimir Comprobante
                    </button>
                </div>`);
                
                // Limpiar todo
                carritoProductos = [];
                clienteSeleccionado = null;
                actualizarTablaCarrito();
                $('#ventaCliente').val('');
                $('#ventaFormaPagoFinal').val('');
                $('#infoCliente').hide();
                $('#formAgregarProducto')[0].reset();
                $('#ventaNombreMaterial').prop('disabled', true).html('<option value="">Seleccione un proveedor primero...</option>');
                limpiarCampos();
                habilitarBotonVenta();
                
                // Recargar materiales para actualizar stock
                const proveedorActual = $('#ventaProveedor').val();
                if (proveedorActual) {
                    cargarMaterialesPorProveedor(proveedorActual);
                }
            },
            error: function(xhr) {
                console.error("Error en venta:", xhr.responseText);
                let errorMsg = "Error al registrar la venta.";
                if (xhr.responseJSON && xhr.responseJSON.error) {
                    errorMsg = xhr.responseJSON.error;
                }
                mensajeDiv.html(`<div class="alert alert-danger">${errorMsg}</div>`);
                $('#btnRegistrarVenta').prop('disabled', false);
            }
        });
    });
});
</script>
</body>
</html>
