        </style>
        <!--===============================================================================================-->
    </head>
    <body>
        <div class="limiter">
            <div class="auth-container">
                <div class="auth-wrap animate__animated animate__fadeInDown">
                    <form class="login100-form validate-form" id="loginForm">
                        <div class="auth-logo">
                            <i class="zmdi zmdi-account"></i>
                        </div>

                        <h2 class="auth-title p-b-40">
                            INICIAR SESIÓN
                        </h2>

                        <div class="wrap-input100 validate-input m-b-23" data-validate="Usuario es requerido">
                            <input class="input100" type="text" id="username" name="username" placeholder="Usuario">
                            <span class="focus-input100" data-placeholder="&#xf207;"></span>
                        </div>

                        <div class="wrap-input100 validate-input m-b-23" data-validate="Contraseña es requerida">
                            <input class="input100" type="password" id="password" name="password" placeholder="Contraseña">
                            <span class="focus-input100" data-placeholder="&#xf191;"></span>
                        </div>

                        <div class="container-login100-form-btn p-t-10">
                            <button class="auth-btn" type="submit">
                                ACCEDER
                            </button>
                        </div>

                        <div id="message" class="message"></div>

                        <div class="text-center p-t-30">
                            <a href="register.html" class="txt2">
                                Registrarse
                            </a>
                            <span class="txt1 p-l-10 p-r-10">|</span>
                            <a href="reset_pass.html" class="txt2">
                                Olvidé mi contraseña
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <div id="dropDownSelect1"></div>
        
        <!--===============================================================================================-->
        <script src="vendor/jquery/jquery-3.2.1.min.js"></script>

        <script src="vendor/daterangepicker/daterangepicker.js"></script>
        <!--===============================================================================================-->
        <script src="vendor/countdowntime/countdowntime.js"></script>
        <!--===============================================================================================-->
        <script src="js/config.js"></script>
        <script src="js/main.js"></script>
    </body>
